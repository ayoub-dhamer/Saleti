name: saleti
description: "An Islamic App, designed to help muslims with their prayers and din"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

  adhan: ^2.0.0
  # FIXED (polish #11): was ^10.0.0. Checked the actual current
  # getCurrentPosition implementation before bumping — desiredAccuracy/
  # timeLimit (used in location_service.dart) were deprecated in 13.0.0 in
  # favor of a LocationSettings object, but are still accepted and
  # functionally forwarded, not removed, so this app's existing calls keep
  # working as-is (with a deprecation warning). Migrating to
  # AndroidSettings/LocationSettings is a reasonable future cleanup, not a
  # requirement of this bump.
  geolocator: ^14.1.1
  geocoding: ^3.0.0
  table_calendar: ^3.0.10
  hijri: ^3.0.0
  quran: ^1.4.1
  shared_preferences: ^2.2.2
  stylish_bottom_bar: ^1.1.1
  # FIXED (polish #11): was ^11.3.0. The Dart-facing API this app actually
  # calls (Permission.X.isGranted / .request()) is unchanged across this
  # range — the changes are native-side (permission_handler_android bumps,
  # compileSdkVersion). Two of those fixes are directly relevant to this
  # app: 12.0.2 fixed Permission.scheduleExactAlarm not opening the
  # settings screen, and 12.0.4 fixed scheduleExactAlarm incorrectly
  # reporting "denied" by default on pre-Android-12 devices (where the
  # permission doesn't functionally exist and should read as granted) —
  # both bear directly on bug #5's onboarding/readiness-banner work.
  permission_handler: ^13.0.2
  # NOT bumped (polish #11): flutter_local_notifications is pinned at
  # ^17.1.0 deliberately, not overlooked. Current latest is 22.x — a
  # 5-major-version jump — and this package's own release history (and at
  # least one downstream package's migration notes) suggests show(),
  # zonedSchedule(), and/or initialize() may have changed which parameters
  # are positional vs named somewhere in that range. This app's azan,
  # prayer-reminder, Friday-reminder and Eid-reminder scheduling all go
  # through exactly those methods (see notification_service.dart). I
  # couldn't get a confident, verified answer on the exact signature
  # change from here, and this is the single most safety-critical
  # dependency in the app — guessing wrong risks silently breaking prayer
  # notifications, which is worse than staying a few versions behind. This
  # needs a real device/emulator to upgrade and test against, which I
  # don't have in this environment.
  flutter_local_notifications: ^17.1.0

  android_alarm_manager_plus: ^4.0.8
  flutter_compass: ^0.8.0

  android_intent_plus: ^5.3.1

  wakelock_plus: ^1.2.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  collection: ^1.17.0
  auto_size_text: ^3.0.0
  intl: ^0.19.0

  azan_platform:
    path: azan_platform

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.0
  build_runner: ^2.4.6

  flutter_launcher_icons: ^0.11.0

  # FIXED (polish #9): was indented one level too deep, under
  # flutter_icons: below, as if it were one of *that* package's own
  # config keys (alongside android/ios/image_path). flutter_launcher_icons
  # only reads the keys it recognizes there and silently ignores the rest,
  # so flutter_lints was never actually declared as a dependency anywhere
  # — `flutter pub get` never fetched it, and analysis_options.yaml's
  # `include: package:flutter_lints/flutter.yaml` (referenced in the
  # comment below) would fail to resolve, since the package it points at
  # was never added. Moved up here, as its own top-level entry under
  # dev_dependencies — where every other dev tool below (flutter_test,
  # hive_generator, build_runner, flutter_launcher_icons) already lives.
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/mosque.png
    - assets/data/mushaf_complete.json
    - assets/images/mushaf_frame_dark.png
    - assets/images/mushaf_frame_light.png
    - assets/images/surah_name_frame_light.png
    - assets/images/surah_name_frame_dark.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

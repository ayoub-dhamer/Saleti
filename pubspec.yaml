name: saleti
description: "An Islamic App, designed to help muslims with their prayers and din"
publish_to: "none" # Remove this file if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  adhan: ^2.0.0
  geolocator: ^10.0.0
  geocoding: ^3.0.0
  table_calendar: ^3.0.10
  hijri: ^3.0.0
  quran: ^1.4.1
  shared_preferences: ^2.2.2
  stylish_bottom_bar: ^1.1.1
  permission_handler: ^11.3.0
  flutter_local_notifications: ^17.1.0
  android_alarm_manager_plus: ^4.0.8
  flutter_compass: ^0.8.0
  android_intent_plus: ^5.3.1
  wakelock_plus: ^1.2.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  collection: ^1.17.0
  auto_size_text: ^3.0.0
  intl: ^0.19.0

  azan_platform:
    path: azan_platform

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/mosque.png
    - assets/data/mushaf_complete.json
    - assets/images/mushaf_frame_dark.png
    - assets/images/mushaf_frame_light.png
    - assets/images/surah_name_frame_light.png
    - assets/images/surah_name_frame_dark.png

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

plugins {
    id "com.android.library"
    id "kotlin-android"
}

android {
    namespace = "com.saleti.azan_platform"
    compileSdk = 35 // ADJUST if your app module uses a different compileSdk

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}